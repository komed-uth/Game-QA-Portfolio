name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
      - name: Check preview startup
        run: npm run check:preview
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check browser runner diagnostics
        run: npm run check:runner
      - name: Check rendered portfolio
        run: npm run check:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-failures
          path: .scratch/browser-checks/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
