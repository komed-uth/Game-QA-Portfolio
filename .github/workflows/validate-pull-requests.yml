name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
      - name: Check preview startup
        run: npm run check:preview
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check rendered portfolio
        run: npm run check:browser
