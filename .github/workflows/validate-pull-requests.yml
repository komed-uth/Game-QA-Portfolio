name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

env:
  PORTFOLIO_PR_NUMBER: ${{ github.event.pull_request.number }}
  PORTFOLIO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Check pull-request whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:whitespace
      - name: Validate pull-request checkout and build
        uses: ./.github/actions/validate-portfolio
