name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check pull-request whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:whitespace
      - name: Build portfolio
        run: npm run build
      - name: Check preview startup
        run: npm run check:preview
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check content editing workflow
        run: npm run check:content-workflow
      - name: Check browser runner diagnostics
        run: npm run check:runner
      - name: Check rendered portfolio
        run: npm run check:browser
      - name: Upload browser run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-validation-evidence
          path: |
            .scratch/browser-runs/
            .scratch/browser-checks/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
